# Supabase CLI config for local development (`supabase start`). Production settings live in the
# Supabase dashboard and must match the values below.
project_id = "wayfare"

[api]
port = 54321

[db]
port = 54322
major_version = 16

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset"]
# Sessions survive long offline periods; refresh tokens rotate.
jwt_expiry = 3600
enable_refresh_token_rotation = true
minimum_password_length = 10
password_requirements = "letters_digits"
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
